<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Welcome to the Event Registration Page</h1>
    <p>Please fill out the form below to register your team for the event.</p>
    <form id="registrationForm">
        <label for="teamName">Team Name:</label>
        <input type="text" id="teamName" name="teamName" required><br><br>

        <label for="eventName">Event:</label>
        <select id="eventName" name="eventName" required>
            <option value="">Select event</option>
            <option value="event1">Event 1</option>
            <option value="event2">Event 2</option>
            <option value="event3">Event 3</option>
        </select><br><br>

        <label for="teamMembers">Number of Team Members:</label>
        <input type="number" id="teamMembers" name="teamMembers" min="1" required><br><br>

        <button type="submit">Register Team</button>
    </form>
</body>
</html>
